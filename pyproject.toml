[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a workspace marker — no source code lives at the root.
# bypass-selection lets hatchling produce an empty wheel rather than
# erroring on "no files to include". Used by `pip install -e .[dev]`
# to pull in the workspace-wide dev tooling without shipping a real package.
bypass-selection = true

[project]
name = "censprobe"
version = "0.1.0"
description = "Censorship Probe — distributed VPN censorship measurement system"
requires-python = ">=3.11"

[project.optional-dependencies]
# Workspace-wide dev tooling. Install via:
#   pip install -e packages/probe-core -e packages/solo -e packages/listener \
#               -e packages/client -e packages/dashboard/sync-api -e .[dev]
# Per-package test extras live in each package's pyproject.toml under [project.optional-dependencies] test.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "pytest-xdist>=3",
    "pytest-regressions>=2.5",
    "respx>=0.21",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "yamllint>=1.35",
    "asgi-lifespan>=2",
    "testcontainers[postgres]>=4",
    "jsonschema>=4.21",
    "greenlet>=3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative starting set — bugbear + pyflakes + isort + pyupgrade.
# Tightening happens module-by-module rather than via a global flag flip.
select = ["E", "F", "W", "B", "I", "UP", "S"]
# S101: assert in tests is fine; S404/S603/S607: subprocess is intentional in CLI launchers.
ignore = ["S101", "S404", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are explicitly *meant* to be
# evaluated at function-definition time; the B008 warning ("don't call
# functions in argument defaults") doesn't apply. Telling ruff they're
# safe is the documented workaround. The list comes from the FastAPI
# tutorial's recommended ruff config.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", ".venv/"]

# probe-core полностью strict с Этапа 1.
# Остальные пакеты (solo/listener/client/sync-api) подключаются модуль-за-модулем
# в Этапе 8 через дополнительные [[tool.mypy.overrides]] блоки.
[[tool.mypy.overrides]]
module = "censprobe_core.*"
strict = true

# Phase 8 — постепенная миграция остальных пакетов на mypy strict, по
# модулю за раз. Каждый блок добавляется только после того, как
# `mypy <module>.py` проходит чисто на нём; это страхует от лавинного
# срабатывания strict-проверок поверх legacy-кода.
[[tool.mypy.overrides]]
module = "sync_api.parser"
strict = true

[[tool.mypy.overrides]]
module = "sync_api.db"
strict = true

[[tool.mypy.overrides]]
module = "sync_api.main"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.ss_responder"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener._responder_dispatch"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.vless_reality_wrapper"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.hysteria_wrapper"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.openvpn_responder"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.mtproxy_responder"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.wg_responder"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.echo_server"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.credentials"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.cred_server"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener._responder_base"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_listener.main"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_client._probe_dispatch"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_client.main"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_solo.main"
strict = true

[[tool.mypy.overrides]]
module = "censprobe_sync.main"
strict = true

[tool.pytest.ini_options]
testpaths = [
    "packages/probe-core/tests",
    "packages/solo/tests",
    "packages/listener/tests",
    "packages/client/tests",
    "packages/sync/tests",
    "packages/dashboard/sync-api/tests",
    "tests",
]
asyncio_mode = "auto"
# Share a single event loop across all tests so async fixtures (e.g. the
# integration-test sync-api Postgres engine) can hold connections that
# remain valid across tests. Per-test loops would otherwise close
# asyncpg connections on a torn-down loop, surfacing as "Event loop is
# closed" RuntimeErrors during fixture teardown.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires Postgres or real subprocess",
    "e2e: docker-compose orchestrated end-to-end",
    "network: hits public internet (CI job network-tests, every push/PR)",
    "needs_wg: requires wg binary",
    "needs_xray: requires xray binary",
    "slow: > 1s",
]
filterwarnings = [
    "error::DeprecationWarning",
    # pydantic models in censprobe_core.models start with "Test" (TestResult,
    # TestRun) and pytest tries to collect them as test classes. Suppress —
    # the alternative (renaming the model or adding __test__ = False to the
    # production class) bleeds tests-only concerns into the runtime code.
    "ignore::pytest.PytestCollectionWarning",
]
# --import-mode=importlib avoids the "tests" package-name collision across
# the 5 per-package tests/ trees (each has its own conftest.py and they'd
# otherwise all import as `tests.conftest` and clash).
# https://docs.pytest.org/en/stable/explanation/goodpractices.html#choosing-an-import-mode
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not e2e and not network and not needs_wg and not needs_xray'"

[tool.coverage.run]
branch = true
source = ["packages"]
omit = [
    "*/tests/*",
    "*/_privsep.py",
    "*/__init__.py",
]
# "thread" is sufficient for asyncio-based tests. "greenlet" would also be
# needed to trace SQLAlchemy's internal greenlet usage, but requires the
# greenlet package to be installed in every test environment — adding it
# globally is fragile. SQLAlchemy integration tests (Phase 4) can be revisited.
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
# Test trees use ``assert`` freely; B101 stays meaningful for src/.
exclude_dirs = ["tests", "*/tests/*", "build", "dist"]
# B404/B603/B607: subprocess is intentional in CLI launchers and runner
# helpers — bandit can't tell apart "running curl/wg/ip" from "exec'ing
# arbitrary operator input", but in this project no subprocess command
# ever interpolates user-controlled strings (all argv lists are
# constructed from validated config + hardcoded constants).
# B101 (assert_used) was on this list before 2026-05-14, which silently
# hid 4 production asserts that python -O would have stripped. Audit
# removed it; if a new src/ assert ever lands and is legitimate (mypy
# narrowing), suppress in-place with ``# nosec B101 — <reason>``.
skips = ["B404", "B603", "B607"]
