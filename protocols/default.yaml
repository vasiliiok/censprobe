# VPN protocol definitions — shared by listener and client
#
# Listener запускает responders для всех; client бьёт по каждому.
# Ни один из протоколов НЕ требует владения доменом.
#
# Разнообразие маскировки:
#  - openvpn:       классика без маскировки (baseline "как легко блокируют")
#  - wireguard:     классика без маскировки (второй baseline)
#  - amneziawg:     WireGuard + header randomization + junk packets (DPI-resistant fork)
#  - shadowsocks:   чистая энтропия без структуры, AEAD
#  - vless_reality: mimicry реального TLS к внешнему домену
#  - hysteria2:     QUIC/HTTP/3 mimicry + Salamander obfs

protocols:
  - name: openvpn
    port: 1194
    transport: udp
    description: "OpenVPN static-key mode (PSK, no PKI)"
    blocked_in_ru: true  # reference for scoring context

  - name: wireguard
    port: 51820
    transport: udp
    description: "WireGuard vanilla — Curve25519"
    blocked_in_ru: true

  - name: amneziawg
    port: 51821
    transport: udp
    description: "AmneziaWG — WireGuard + DPI obfuscation"
    blocked_in_ru: false
    # AmneziaWG 2.0 obfuscation parameters — identical on server and client.
    # Concrete values are generated by listener and stored in protocols.yaml per test_id.
    # Defaults used for first-run generation:
    obfs_defaults:
      jc: 8        # junk packet count before handshake (4-12 recommended)
      jmin: 40     # min junk packet size (bytes)
      jmax: 70     # max junk packet size (bytes)
      s1: 86       # padding before handshake init (15-150; S1+56 != S2)
      s2: 42       # padding before handshake response (15-150)
      # H1-H4 are random uint32 values, NOT equal to 1/2/3/4 (standard WG types)
      # Generated randomly at listener first-run

  - name: shadowsocks
    port: 8388
    transport: tcp
    method: "2022-blake3-aes-256-gcm"
    description: "Shadowsocks 2022 edition (AEAD, BLAKE3 key derivation)"
    blocked_in_ru: false  # harder to detect

  - name: vless_reality
    port: 443
    transport: tcp
    description: "VLESS + XTLS-Reality — TLS mimicry to real SNI"
    blocked_in_ru: false
    flow: "xtls-rprx-vision"
    # sni_cover: domain mimicked in TLS handshake
    # Requirements: TLS 1.3 + HTTP/2, no redirect to www, geographically close
    sni_cover: "apimaps.yandex.ru"
    fingerprint: "chrome"  # uTLS Chrome fingerprint

  - name: hysteria2
    port: 443
    transport: udp
    description: "Hysteria 2 — QUIC + Salamander XOR obfuscation"
    blocked_in_ru: false
    obfs: "salamander"
    bandwidth:
      up_mbps: 100
      down_mbps: 500
