# SonarCloud configuration for censprobe.
# Authenticated via SONAR_TOKEN secret in GitHub Actions (see .github/workflows/ci.yml).
# Local scans (rare) need a personal token: SonarSource/sonar-scanner-cli + SONAR_TOKEN env var.

sonar.organization=vasiliiok
sonar.projectKey=vasiliiok_censprobe
sonar.projectName=censprobe
sonar.projectVersion=0.1.0

# Source layout: every package's src/ tree, plus the workspace-level tests/ directory.
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/tests/**

# Skip generated/private artifacts. _privsep.py is the C-shim wrapper for raw-socket
# privileges — useful at runtime, irrelevant for static analysis.
sonar.exclusions=**/__pycache__/**,**/_privsep.py,packages/dashboard/grafana/**,reports/**

sonar.python.version=3.11

# Coverage + xunit are produced by `pytest --cov-report=xml --junitxml=junit.xml` per package
# matrix entry; download-artifact merges them into the workspace root before sonar runs.
sonar.python.coverage.reportPaths=coverage-*.xml
sonar.python.xunit.reportPath=junit-*.xml

sonar.coverage.exclusions=**/tests/**,**/__init__.py,**/_privsep.py

# Snapshots and contracts are intentionally repetitive — exclude from copy-paste detector
# so they don't dominate the duplication score.
sonar.cpd.exclusions=tests/snapshots/**,tests/contracts/**,**/grafana/dashboards/**
