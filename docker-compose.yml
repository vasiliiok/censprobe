## Pre-built images are pulled from Docker Hub when available.
## pull_policy: missing — uses local cache if present, pulls from registry
## if not, falls back to local build if the pull fails.
##
## Docker Hub images are public — no `docker login` required to pull.
##
## Override defaults via .env or environment:
##   DOCKERHUB_USERNAME — Docker Hub username (required; set in .env)
##   DOCKERHUB_TAG      — image tag to pull   (default: main)

services:

  # ─────────────────────────────────────────────────────────────────
  # 1. SOLO — тесты с перспективы тестируемого RU-сервера
  # Usage: TEST_ID=selectel-spb-001 docker compose --profile solo up
  # ─────────────────────────────────────────────────────────────────
  solo:
    profiles: [solo]
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required — copy .env.example to .env}/censprobe-solo:${DOCKERHUB_TAG:-main}
    pull_policy: missing
    build:
      context: .
      dockerfile: packages/solo/Dockerfile
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      TEST_ID: ${TEST_ID:-}
      RUNS_COUNT: ${RUNS_COUNT:-3}
      IPAPI_IS_KEY: ${IPAPI_IS_KEY:-}
      CENSPROBE_GIT_EMAIL: ${CENSPROBE_GIT_EMAIL:-noreply@censprobe.local}
      CENSPROBE_GIT_NAME: ${CENSPROBE_GIT_NAME:-censprobe-bot}
    volumes:
      - ./:/workspace
      - ~/.ssh:/root/.ssh:ro
    working_dir: /workspace
    restart: "no"

  # ─────────────────────────────────────────────────────────────────
  # 2. LISTENER — VPN-порты на тестируемом сервере
  # Usage: TEST_ID=... SESSION_ID=client-home-rt-spb docker compose --profile listener up
  # ─────────────────────────────────────────────────────────────────
  listener:
    profiles: [listener]
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required — copy .env.example to .env}/censprobe-listener:${DOCKERHUB_TAG:-main}
    pull_policy: missing
    build:
      context: .
      dockerfile: packages/listener/Dockerfile
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    # OpenVPN responder needs /dev/net/tun.
    devices:
      - "/dev/net/tun:/dev/net/tun"
    environment:
      TEST_ID: ${TEST_ID:-}
      SESSION_ID: ${SESSION_ID:-}
      IPAPI_IS_KEY: ${IPAPI_IS_KEY:-}
      CENSPROBE_GIT_EMAIL: ${CENSPROBE_GIT_EMAIL:-noreply@censprobe.local}
      CENSPROBE_GIT_NAME: ${CENSPROBE_GIT_NAME:-censprobe-bot}
    volumes:
      - ./:/workspace
      - ~/.ssh:/root/.ssh:ro
    working_dir: /workspace
    stop_grace_period: 60s
    restart: "no"

  # ─────────────────────────────────────────────────────────────────
  # 3. CLIENT — handshake-тесты с клиентской сети
  # Usage: TEST_ID=... SERVER_HOST=1.2.3.4 docker compose --profile client up
  # ─────────────────────────────────────────────────────────────────
  client:
    profiles: [client]
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required — copy .env.example to .env}/censprobe-client:${DOCKERHUB_TAG:-main}
    pull_policy: missing
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    network_mode: host
    # NET_ADMIN: required for `ip link add wireguard`/awg-quick.
    # /dev/net/tun: required for OpenVPN client tunnel.
    cap_add: [NET_RAW, NET_ADMIN]
    devices:
      - "/dev/net/tun:/dev/net/tun"
    environment:
      TEST_ID: ${TEST_ID:-}
      SESSION_ID: ${SESSION_ID:-}
      SERVER_HOST: ${SERVER_HOST:-}
      IPAPI_IS_KEY: ${IPAPI_IS_KEY:-}
      CENSPROBE_GIT_EMAIL: ${CENSPROBE_GIT_EMAIL:-noreply@censprobe.local}
      CENSPROBE_GIT_NAME: ${CENSPROBE_GIT_NAME:-censprobe-bot}
    volumes:
      - ./:/workspace
      - ~/.ssh:/root/.ssh:ro
    working_dir: /workspace
    restart: "no"

  # ─────────────────────────────────────────────────────────────────
  # 4. CONTROL — эталонный baseline из чистой юрисдикции (DE VPS)
  # Usage: docker compose --profile control up
  # ─────────────────────────────────────────────────────────────────
  control:
    profiles: [control]
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required — copy .env.example to .env}/censprobe-control:${DOCKERHUB_TAG:-main}
    pull_policy: missing
    build:
      context: .
      dockerfile: packages/control/Dockerfile
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      RUNS_COUNT: ${RUNS_COUNT:-5}
      IPAPI_IS_KEY: ${IPAPI_IS_KEY:-}
      CENSPROBE_GIT_EMAIL: ${CENSPROBE_GIT_EMAIL:-noreply@censprobe.local}
      CENSPROBE_GIT_NAME: ${CENSPROBE_GIT_NAME:-censprobe-bot}
      CONTROL_ID: ${CONTROL_ID:-control-de-01}
      CONTROL_COUNTRY: ${CONTROL_COUNTRY:-}
    volumes:
      - ./:/workspace
      - ~/.ssh:/root/.ssh:ro
    working_dir: /workspace
    restart: "no"

  # ─────────────────────────────────────────────────────────────────
  # 5. DASHBOARD — Grafana + Postgres + sync-api
  # Usage: docker compose --profile dashboard up -d
  # Open: http://localhost:3000 (admin/admin)
  # ─────────────────────────────────────────────────────────────────
  postgres:
    profiles: [dashboard]
    image: postgres:16
    environment:
      POSTGRES_DB: censprobe
      POSTGRES_USER: censprobe
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — copy .env.example to .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Pin -d so the probe is satisfied only after Postgres has finished
      # creating POSTGRES_DB ("censprobe") — `pg_isready` returns 0 as soon
      # as the postmaster accepts connections, which happens before the
      # database itself is ready for queries.
      test: ["CMD-SHELL", "pg_isready -U censprobe -d censprobe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sync-api:
    profiles: [dashboard]
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required — copy .env.example to .env}/censprobe-sync-api:${DOCKERHUB_TAG:-main}
    pull_policy: missing
    build:
      context: .
      dockerfile: packages/dashboard/sync-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://censprobe:${DB_PASSWORD:?DB_PASSWORD is required}@postgres/censprobe
      WORKSPACE: /workspace
    volumes:
      - ./:/workspace
    # Bind to loopback only — the API has no authentication, and the only
    # in-cluster consumer is Grafana (read-only via Postgres anyway).
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Wrapped in `python -c` so we don't need curl/wget in the slim
      # image. /health returns 200 once init_db() finishes and FastAPI
      # is serving — that's the signal Grafana is waiting for below.
      test:
        - "CMD-SHELL"
        - "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=2).status == 200 else 1)'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: [dashboard]
    # 11.5.x is the long-term support line maintained alongside 13.x;
    # 11.2.0 missed several CVE fixes published in 2025. Bumping the
    # minor only keeps the schemaVersion: 39 dashboards compatible.
    image: grafana/grafana:11.5.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required — copy .env.example to .env}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      DB_PASSWORD: ${DB_PASSWORD:-censprobe}
      # ── strip Grafana to dashboards only ──────────────────────────────
      # We use Grafana solely as a viewer over the censprobe Postgres
      # datasource. Everything below disables features we don't use,
      # hides their nav entries, and stops outbound calls.
      GF_EXPLORE_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_USERS_HOME_PAGE: "/d/censprobe-01"
      # default_home_dashboard_path makes the "Home" nav item open 01 directly
      # instead of the empty Grafana welcome screen.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/01-test-overview.json"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SNAPSHOTS_PUBLIC_MODE: "false"
      GF_HELP_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./packages/dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./packages/dashboard/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      # Without service_healthy, Grafana would race ahead of Postgres /
      # sync-api on `up`, log datasource errors, and leave the user
      # staring at a "Database connection failed" toast.
      postgres:
        condition: service_healthy
      sync-api:
        condition: service_healthy
    restart: unless-stopped


volumes:
  db_data:
  grafana_data:
