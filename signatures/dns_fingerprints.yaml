# DNS fingerprints — known "poisoned" IP ranges returned by censoring resolvers
# Used to detect DNS poisoning: if resolved IP is in these ranges, it's likely poisoned

# Known RKN / ISP redirect IPs
known_redirect_ips:
  - "80.80.80.80"      # Common ISP redirect
  - "95.161.246.2"     # Some RU ISPs
  - "212.1.56.158"
  - "195.19.220.215"
  - "81.23.8.235"

# Known "parking" ASNs that indicate DNS poisoning
# If resolved IP belongs to these ASNs and cert is not valid → poisoning
suspicious_asns:
  - AS8595   # OJSC WestCall Ltd
  - AS29124  # Blocking-related
  - AS12668  # Some redirect AS

# Trusted ASNs for major services (for DNS validation)
# If resolved IP NOT in expected_asns → suspicious
expected_asns:
  cloudflare: [AS13335]
  google: [AS15169, AS36040]
  telegram: [AS62041, AS59930]
  youtube: [AS15169, AS36040, AS43515]
  instagram: [AS32934]  # Meta
  facebook: [AS32934]   # Meta
  twitter: [AS13414]
  wikipedia: [AS14907]  # Wikimedia
  signal: [AS396982]    # Google Cloud (Signal uses GCP)

# NXDOMAIN injection indicators
# Some Russian resolvers return specific IPs instead of NXDOMAIN
nxdomain_hijack_ips:
  - "185.53.179.14"
