# Block page fingerprints — patterns identifying censorship block pages
# Used to distinguish "censored" from "service down"

block_pages:
  # Роскомнадзор / ТСПУ standard block page.
  # WARNING: "Роскомнадзор" alone is NOT a reliable signal — every Russian
  # news site (meduza.io, BBC Russian, tvrain.ru, etc.) publishes articles
  # mentioning Роскомнадзор and would match. Use precise legal phrasing
  # or the rkn.gov.ru URL which appears only in actual block pages.
  rkn_standard:
    description: "Стандартная страница блокировки РКН"
    title_patterns:
      - "Доступ ограничен"
      - "Сайт заблокирован"
    body_patterns:
      - "rkn.gov.ru"
      - "Доступ к информационному ресурсу ограничен"
    http_status: [200, 403]

  # Common ISP-level block pages
  isp_generic:
    description: "Типичные страницы блокировки ISP"
    title_patterns:
      - "Ресурс заблокирован"
      - "Доступ запрещён"
      - "Страница недоступна"
    body_patterns:
      - "заблокирован по решению"
      - "zapret.gov.ru"

  # MTS specific — must be a redirect to blocked.mts.ru OR show the exact
  # block page phrasing. Matching just "мтс" or "mts.ru" in body is too
  # broad: any Russian news article mentioning MTS triggers this pattern.
  mts_block:
    description: "МТС block page"
    http_status: [200, 302, 403]
    title_patterns:
      - "Ресурс заблокирован"
      - "Доступ ограничен"
    body_patterns:
      - "blocked.mts.ru"
      - "Данный сайт заблокирован по решению"
    redirect_domains:
      - blocked.mts.ru

  # Rostelekom / RT — same problem: "rt.ru" appears in countless articles.
  # Require the actual block-page subdomain or precise legal phrasing.
  rt_block:
    description: "Ростелеком block page"
    http_status: [200, 302, 403]
    title_patterns:
      - "Ресурс заблокирован"
      - "Доступ ограничен"
    body_patterns:
      - "blocked.rt.ru"
      - "Данный сайт заблокирован по решению"
    redirect_domains:
      - blocked.rt.ru

  # ТСПУ-style TCP RST (no body — pure connection reset)
  tcp_rst_tspu:
    description: "ТСПУ TCP RST injection — no HTML, just connection reset"
    detection: "tcp_rst_after_client_hello"
    notes: "Most common ТСПУ method — no block page, just RST"

# HTTP status codes that indicate geo-blocking (not censorship)
geoblock_indicators:
  status_codes: [403, 451]
  # 451 = Unavailable For Legal Reasons (RFC 7725)
  notes: "If TLS handshake succeeds and cert is valid, 403/451 = geoblock, not ТСПУ"
