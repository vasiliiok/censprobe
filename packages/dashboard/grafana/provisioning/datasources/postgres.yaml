apiVersion: 1

datasources:
  - name: DS_CENSPROBE_PG
    type: postgres
    uid: DS_CENSPROBE_PG
    url: postgres:5432
    database: censprobe
    user: censprobe
    secureJsonData:
      password: "${DB_PASSWORD}"
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
