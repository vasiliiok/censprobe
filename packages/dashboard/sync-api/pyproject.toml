[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "censprobe-sync-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "censprobe-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "gitpython>=3.1",
]
[tool.hatch.build.targets.wheel]
packages = ["src/sync_api"]
