[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "censprobe-sync-api"
# Keep in sync with sync_api.main.SERVICE_VERSION (surfaced via /health and
# the FastAPI app metadata).
version = "0.4.0"
requires-python = ">=3.11"
# Minimal runtime deps. The schema is created by SQLAlchemy `create_all`
# on first start; there is currently no migration story (see db.py docstring).
# Schema-incompatible changes require dropping the dev `db_data` volume.
dependencies = [
    "censprobe-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pyyaml>=6.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/sync_api"]
