[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "censprobe-listener"
version = "0.1.0"
description = "Censprobe listener container — VPN protocol responder (M5)"
requires-python = ">=3.11"
dependencies = [
    "censprobe-core",
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/censprobe_listener"]
