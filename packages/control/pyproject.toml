[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "censprobe-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["censprobe-core", "numpy>=1.26", "click>=8.1", "rich>=13.7"]
[tool.hatch.build.targets.wheel]
packages = ["src/censprobe_control"]
