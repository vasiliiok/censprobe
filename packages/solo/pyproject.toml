[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "censprobe-solo"
version = "0.1.0"
description = "Censprobe solo container — server-side probe"
requires-python = ">=3.11"
dependencies = [
    "censprobe-core",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/censprobe_solo"]
