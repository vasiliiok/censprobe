[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "censprobe-core"
version = "0.1.0"
description = "Censprobe shared measurement library"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "dnspython[doh]>=2.6",
    "aiodns>=3.2",
    "cryptography>=42",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-regressions>=2.5",
    "respx>=0.21",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/censprobe_core"]
