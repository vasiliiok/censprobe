# Local pre-commit gates that mirror the CI quality bar.
# Activate with: pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Two-stage strategy: cheap hooks on every commit, slow hooks (mypy, hadolint-docker)
# only on push so commits don't pause for ~10s.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
        # censprobe.yaml + targets/*.yaml validated through Pydantic by the local
        # validate-targets hook below — generic check-yaml would just duplicate noise.
        exclude: ^(targets/.*|censprobe\.yaml)$
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - "-d"
          - "{extends: default, rules: {line-length: {max: 200}, truthy: {allowed-values: [\"true\", \"false\"]}, document-start: disable}}"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # Slow hooks — only on pre-push.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.7"
          - "types-PyYAML"
        args: ["--config-file=pyproject.toml"]
        # mypy needs the workspace installed to resolve censprobe-core imports;
        # CI handles that. Locally we just type-check probe-core (the strict target).
        files: ^packages/probe-core/src/
        stages: [pre-push]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        stages: [pre-push]

  - repo: local
    hooks:
      - id: validate-targets
        name: Validate targets/*.yaml + censprobe.yaml via Pydantic
        entry: python -c "import sys; from pathlib import Path; sys.path.insert(0, 'packages/probe-core/src'); from censprobe_core.config import load_config; from censprobe_core.targets import load_targets; load_config(Path('.')); load_targets(Path('targets'))"
        language: system
        files: ^(targets/.*\.yaml|censprobe\.yaml)$
        pass_filenames: false
