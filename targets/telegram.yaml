# Telegram endpoints — April 2026
# Source: official Telegram documentation + community verification

# Canonical TCP ports per core.telegram.org/mtproto/transports: 80, 443, 5222.
# Port 2001 is not in the official transports list and is unreachable to all
# DCs from clean jurisdictions — testing it produced 5 INCONCLUSIVE results
# per DC per run with no signal value, so it has been removed.
api_datacenters:
  - id: 1
    name: pluto
    location: Miami
    ipv4: 149.154.175.53
    ipv6: "2001:b28:f23d:f001::a"
    ports: [443, 80, 5222]

  - id: 2
    name: venus
    location: Amsterdam
    ipv4: 149.154.167.51
    ipv6: "2001:67c:4e8:f002::a"
    ports: [443, 80, 5222]

  - id: 3
    name: aurora
    location: Miami
    ipv4: 149.154.175.100
    ipv6: "2001:b28:f23d:f003::a"
    ports: [443, 80, 5222]

  - id: 4
    name: vesta
    location: Amsterdam
    ipv4: 149.154.167.91
    ipv6: "2001:67c:4e8:f004::a"
    ports: [443, 80, 5222]

  - id: 5
    name: flora
    location: Singapore
    ipv4: 91.108.56.130
    ipv6: "2001:b28:f23f:f005::a"
    ports: [443, 80, 5222]

web:
  - web.telegram.org
  - webk.telegram.org
  - weba.telegram.org

auxiliary:
  - core.telegram.org
  - my.telegram.org
  - translations.telegram.org
  - t.me
  - telegram.org
  - desktop.telegram.org
  - macos.telegram.org

cdn:
  # cdn.telegram.org — main CDN (149.154.167.99, cert OK)
  - cdn.telegram.org
  # cdn1/cdn5 resolve via telesco.pe but serve *.t.me cert → HTTPS fails;
  # globally broken (not RU-specific). The probe re-handshakes with
  # verify=False, validates the chain through the system trust store,
  # and matches the cert SAN/CN against `owned_cert_patterns` below to
  # confirm an authentic-but-misconfigured Telegram endpoint instead of
  # treating the failure as censorship.
  - cdn1.cdn-telegram.org
  - cdn4.cdn-telegram.org
  - cdn5.cdn-telegram.org
  # cdn2 and cdn3 are NXDOMAIN everywhere — removed.

# Hostname patterns covering the Telegram-owned cert family. A failed TLS
# handshake whose presented cert (a) chains to a system-trusted CA and
# (b) carries a SAN/CN matching one of these globs is reclassified from
# BLOCKED → INCONCLUSIVE: it is an authentic Telegram endpoint serving a
# misrouted cert, not a TSPU MITM (TSPU cannot mint a Let's Encrypt /
# Sectigo cert for *.t.me). Matched as "*"-as-single-label glob.
owned_cert_patterns:
  - "*.telegram.org"
  - "telegram.org"
  - "*.t.me"
  - "t.me"
  - "*.cdn-telegram.org"
  - "cdn-telegram.org"
  - "*.web.telegram.org"

# Scoring weights for telegram_health (Часть 2.5.7).
# Voice was removed (STUN to Telegram VoIP ports always returns INCONCLUSIVE —
# Telegram uses MTProto/UDP, not RFC 5389 STUN, so no signal). throttling_absence
# was removed alongside Method-A throttling. Remaining weights rescaled to 1.0
# from the original 0.40/0.20/0.15 ratio.
health_weights:
  dc_reachability: 0.55
  web_access: 0.25
  cdn_access: 0.20
