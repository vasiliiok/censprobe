name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    # Skip the whole job on forks. They inherit this workflow file but
    # not vars.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN, so the
    # docker/login-action step would otherwise fail with a confusing red
    # X across every fork. A forker who actually wants to publish their
    # own images can drop this guard or replace the repo string.
    if: github.repository == 'vasiliiok/censprobe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter calls GET /repos/:owner/:repo/pulls/:n/files on PR runs.
      # Without an explicit grant, the workflow-level permissions block
      # restricts GITHUB_TOKEN and the API call returns 403.
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: solo
            dockerfile: packages/solo/Dockerfile
            path: solo
          - name: listener
            dockerfile: packages/listener/Dockerfile
            path: listener
          - name: client
            dockerfile: packages/client/Dockerfile
            path: client
          - name: sync-api
            dockerfile: packages/dashboard/sync-api/Dockerfile
            path: dashboard/sync-api


    steps:
      - uses: actions/checkout@v4

      # Check which files changed. On tag pushes — always rebuild everything.
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.ref_type != 'tag'
        with:
          filters: |
            rebuild:
              - 'packages/${{ matrix.path }}/**'
              - 'packages/probe-core/**'
              - '.github/workflows/build.yml'

      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.rebuild == 'true' || github.ref_type == 'tag'

      - uses: docker/login-action@v4
        if: (steps.changes.outputs.rebuild == 'true' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        if: steps.changes.outputs.rebuild == 'true' || github.ref_type == 'tag'
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/censprobe-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        if: steps.changes.outputs.rebuild == 'true' || github.ref_type == 'tag'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
